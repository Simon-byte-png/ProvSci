[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "provsci"
version = "0.1.0"
description = "Provenance-native scientific result data agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
provsci = "provsci.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
